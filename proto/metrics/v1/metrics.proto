syntax = "proto3";

package metrics.v1;

option go_package = "github.com/ibeloyar/metrics/proto/metrics/v1;metricsv1";

service Metrics {
  rpc UpdateMetrics(UpdateMetricsRequest) returns (UpdateMetricsResponse);
}

message Metric {
  string id = 1;

  enum MType {
    GAUGE = 0;
    COUNTER = 1;
  }

  MType type = 2;
  int64 delta = 3;
  double value = 4;
}

message UpdateMetricsRequest {
  repeated Metric metrics = 1;
}

message UpdateMetricsResponse {}
